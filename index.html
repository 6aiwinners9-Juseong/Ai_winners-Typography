    <style>
        /* --- 🎨 2026 Premium Design System --- */
        :root {
            --nb-yellow: #FFE135;
            --nb-yellow-glow: rgba(255, 225, 53, 0.5);
            --nb-bg: #050505;
            --nb-glass: rgba(255, 255, 255, 0.03);
            --nb-glass-hover: rgba(255, 255, 255, 0.08);
            --nb-border: rgba(255, 255, 255, 0.1);
            --nb-text-main: #ffffff;
            --nb-text-sub: #9ca3af;
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --nb-success: #00E676;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--nb-bg);
            color: var(--nb-text-main);
            margin: 0;
            overflow-y: overlay;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 225, 53, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(100, 100, 255, 0.03), transparent 25%);
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--nb-yellow); }

        /* --- Header --- */
        header {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1200px; height: 70px;
            padding: 0 30px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--nb-border); border-radius: 100px;
            z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .brand { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .brand i { color: var(--nb-yellow); filter: drop-shadow(0 0 10px var(--nb-yellow)); }
        .badge { font-size: 0.75rem; background: var(--nb-yellow); color: #000; padding: 4px 10px; border-radius: 20px; font-weight: 700; }

        .ambient-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; background: radial-gradient(circle at 50% -20%, rgba(255, 225, 53, 0.08), transparent 70%); }

        main { max-width: 1400px; margin: 140px auto 80px; padding: 0 30px; }

        /* --- Filters --- */
        .filter-wrapper { margin-bottom: 60px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .chip {
            padding: 10px 24px; background: var(--nb-glass); border: 1px solid var(--nb-border);
            border-radius: 100px; cursor: pointer; font-size: 0.95rem; color: var(--nb-text-sub);
            transition: all 0.3s var(--ease-elastic); display: flex; align-items: center; gap: 8px;
        }
        .chip:hover { background: var(--nb-glass-hover); transform: translateY(-2px); color: #fff; }
        .chip.active {
            background: var(--nb-yellow); color: #000; border-color: var(--nb-yellow);
            font-weight: 700; box-shadow: 0 0 20px var(--nb-yellow-glow);
        }

        /* --- Section Header --- */
        .section-header {
            display: flex; align-items: center; gap: 15px; margin: 80px 0 30px; 
            padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative;
        }
        .section-header::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 50px; height: 2px; background: var(--nb-yellow); box-shadow: 0 0 10px var(--nb-yellow); }
        .section-title { font-size: 1.8rem; font-weight: 800; color: #fff; margin: 0; letter-spacing: -1px; }
        .section-icon { color: var(--nb-yellow); font-size: 1.5rem; }

        /* --- Grid --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }

        .card {
            background: var(--nb-glass); border: 1px solid var(--nb-border); border-radius: 20px;
            overflow: hidden; cursor: pointer; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; display: flex; flex-direction: column;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02); border-color: rgba(255, 225, 53, 0.3);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.7); z-index: 10;
        }
        .card:hover .card-img-box img { transform: scale(1.1); }

        .card-img-box { width: 100%; padding-top: 100%; position: relative; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card-img-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        
        .card-info { padding: 18px; flex: 1; display: flex; flex-direction: column; justify-content: center; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(0,0,0,0.2) 100%); }
        .card-title { font-size: 1.1rem; font-weight: 700; margin: 0 0 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 0.85rem; color: var(--nb-text-sub); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* --- Load More Card --- */
        .card-more {
            background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; min-height: 200px; transition: 0.3s; color: var(--nb-text-sub); position: relative; overflow: hidden;
        }
        .card-more:hover { border-color: var(--nb-yellow); color: var(--nb-yellow); background: rgba(255, 225, 53, 0.05); transform: translateY(-5px); }
        .more-icon { 
            font-size: 2.5rem; margin-bottom: 15px; background: rgba(255,255,255,0.1); width: 60px; height: 60px; 
            display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.3s;
        }
        .card-more:hover .more-icon { background: var(--nb-yellow); color: #000; transform: rotate(90deg); }
        .more-text { font-size: 1.1rem; font-weight: 700; }
        .more-count { font-size: 0.8rem; margin-top: 5px; opacity: 0.6; }

        /* --- Modal --- */
        dialog {
            background: #111; color: #fff; border: 1px solid #333; border-radius: 24px;
            width: 95%; max-width: 1000px; padding: 0; box-shadow: 0 0 100px rgba(0,0,0,0.8);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        dialog::backdrop { background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        
        .modal-layout { display: flex; height: 80vh; }
        .modal-img { flex: 1.3; background: #000; display: flex; align-items: center; justify-content: center; border-right: 1px solid #222; position: relative; }
        .modal-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .modal-content { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; background: #111; }
        
        .prompt-container { position: relative; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; overflow: hidden; }
        .prompt-header {
            background: #222; padding: 10px 15px; font-size: 0.8rem; color: #888;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
        }
        .prompt-box { padding: 20px; font-family: 'JetBrains Mono', monospace; line-height: 1.7; color: #ddd; font-size: 0.95rem; }
        .highlight { color: var(--nb-yellow); font-weight: bold; text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 4px; }
        
        .btn-copy { 
            background: transparent; color: #fff; border: 1px solid #444; 
            padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; 
            font-weight: 700; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; gap: 6px;
        }
        .btn-copy:hover { background: #333; }
        .btn-copy.success { background: var(--nb-success); border-color: var(--nb-success); color: #000; transform: scale(1.05); }

        .close-btn { 
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); border: 1px solid #444; 
            color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; 
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .close-btn:hover { background: #fff; color: #000; transform: rotate(90deg); }

        @media (max-width: 900px) {
            .modal-layout { flex-direction: column; height: 90vh; }
            .modal-img { height: 40%; border-right: none; border-bottom: 1px solid #222; }
            header { width: 95%; top: 10px; padding: 0 20px; }
        }

        /* Toast */
        .toast-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 30, 0.9); border: 1px solid #444; backdrop-filter: blur(10px);
            padding: 12px 25px; border-radius: 50px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 2000; opacity: 0; pointer-events: none;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .toast-container.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-icon { background: var(--nb-success); color: #000; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .toast-msg { font-size: 0.9rem; font-weight: 600; color: #fff; }
    </style>
</head>

        // --- Config ---
        const categoryMeta = {
            'material': { title: '질감 & 재질', icon: 'fa-gem' },
            'food': { title: '푸드 & 디저트', icon: 'fa-burger' },
            'nature': { title: '자연 & 힐링', icon: 'fa-leaf' },
            'tech': { title: '테크 & SF', icon: 'fa-robot' },
            'art': { title: '예술 & 스타일', icon: 'fa-palette' }
        };

        const contentArea = document.getElementById('contentArea');
        const modal = document.getElementById('modal');
        const chips = document.querySelectorAll('.chip');
        const toast = document.getElementById('toast');
        const copyBtn = document.getElementById('copyBtn');
        
        let currentFilter = 'all';
        let currentItems = [];
        let visibleCount = 0;
        const ITEMS_PER_PAGE = 10; 

        // --- Render ---
        function render(filter) {
            currentFilter = filter;
            contentArea.innerHTML = ''; 

            if (filter === 'all') {
                Object.keys(categoryMeta).forEach(catKey => {
                    const catItems = db.filter(item => item.cat === catKey);
                    if (catItems.length === 0) return;

                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'section-header';
                    sectionHeader.innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px;">
                            <i class="fa-solid ${categoryMeta[catKey].icon} section-icon"></i>
                            <h2 class="section-title">${categoryMeta[catKey].title}</h2>
                        </div>
                    `;
                    contentArea.appendChild(sectionHeader);

                    const grid = document.createElement('div');
                    grid.className = 'grid';
                    
                    createCards(catItems.slice(0, 4), grid);

                    const moreCard = document.createElement('div');
                    moreCard.className = 'card-more';
                    const remaining = Math.max(0, catItems.length - 4);
                    moreCard.innerHTML = `
                        <div class="more-icon"><i class="fa-solid fa-arrow-right"></i></div>
                        <div class="more-text">전체보기</div>
                        <div class="more-count">+${remaining}개 더보기</div>
                    `;
                    moreCard.onclick = () => switchToFilter(catKey);
                    grid.appendChild(moreCard);

                    contentArea.appendChild(grid);
                });

            } else {
                currentItems = db.filter(item => item.cat === filter);
                visibleCount = 0;
                
                const grid = document.createElement('div');
                grid.className = 'grid';
                grid.id = 'filterGrid';
                contentArea.appendChild(grid);
                
                loadMoreItems(); 
            }
        }

        function loadMoreItems() {
            const grid = document.getElementById('filterGrid');
            const existingMoreCard = grid.querySelector('.card-more');
            if (existingMoreCard) existingMoreCard.remove();

            const nextItems = currentItems.slice(visibleCount, visibleCount + ITEMS_PER_PAGE);
            createCards(nextItems, grid);
            visibleCount += nextItems.length;

            if (visibleCount < currentItems.length) {
                const moreCard = document.createElement('div');
                moreCard.className = 'card-more';
                const remaining = currentItems.length - visibleCount;
                moreCard.innerHTML = `
                    <div class="more-icon"><i class="fa-solid fa-plus"></i></div>
                    <div class="more-text">더 불러오기</div>
                    <div class="more-count">${remaining}개 남음</div>
                `;
                moreCard.onclick = loadMoreItems; 
                grid.appendChild(moreCard);
            }
        }

        function switchToFilter(catKey) {
            document.querySelector('.chip.active').classList.remove('active');
            document.querySelector(`.chip[data-filter="${catKey}"]`).classList.add('active');
            render(catKey);
            window.scrollTo(0, 0);
        }

        function createCards(items, parentGrid) {
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item);
                
                // 깃허브 이미지 연결 (확장자는 .jpg 기본)
                const imgUrl = `${IMAGE_BASE_URL}${item.id}.jpg`;
                
                card.innerHTML = `
                    <div class="card-img-box">
                        <img src="${imgUrl}" loading="lazy" alt="${item.title}" 
                             onerror="this.src='https://placehold.co/400x400/222/FFE135?text=No+Image'">
                    </div>
                    <div class="card-info">
                        <h3 class="card-title">${item.title}</h3>
                        <div class="card-desc">${item.prompt.substring(0, 30)}...</div>
                    </div>
                `;
                parentGrid.appendChild(card);
            });
        }

        render('all');

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelector('.chip.active').classList.remove('active');
                chip.classList.add('active');
                render(chip.dataset.filter);
            });
        });

        // --- Copy & Modal ---
        function openModal(item) {
            // 상세 이미지도 깃허브에서 가져옴
            const imgUrl = `${IMAGE_BASE_URL}${item.id}.jpg`;
            
            document.getElementById('mImg').src = imgUrl;
            document.getElementById('mCat').innerText = categoryMeta[item.cat].title.toUpperCase();
            document.getElementById('mTitle').innerText = item.title;
            const markedPrompt = item.prompt.replace(/"(.*?)"/g, '<span class="highlight">"$1"</span>');
            document.getElementById('mPrompt').innerHTML = markedPrompt;
            document.getElementById('mPrompt').dataset.raw = item.prompt;
            resetCopyBtn();
            modal.showModal();
        }
        
        function closeModal() { modal.close(); }
        modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });

        function copyPrompt() {
            const rawText = document.getElementById('mPrompt').dataset.raw;
            navigator.clipboard.writeText(rawText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.classList.add('success');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> COPIED!';
                showToast();
                setTimeout(resetCopyBtn, 2000);
            });
        }

        function resetCopyBtn() {
            const btn = document.getElementById('copyBtn');
            btn.classList.remove('success');
            btn.innerHTML = '<i class="fa-regular fa-copy"></i> COPY CODE';
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
